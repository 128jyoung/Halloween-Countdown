<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Countdown</title>
    <link href="css/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <img src="img/logo.jpg" class="logo">

        <div class="content">
            <h1 class="henny-penny"><span>Halloween is Coming!</span></h1>
            <div class="countdown-time">
                <div>
                    <p id="days" class="rubik-wet-paint">00</p>
                    <span class="rubik-wet-paint">Days</span>
                </div>
                <div>
                    <p id="hours" class="rubik-wet-paint">00</p>
                    <span class="rubik-wet-paint">Hours</span>
                </div>
                <div>
                    <p id="minutes" class="rubik-wet-paint">00</p>
                    <span class="rubik-wet-paint">Minutes</span>
                </div>
                <div>
                    <p id="seconds" class="rubik-wet-paint">00</p>
                    <span class="rubik-wet-paint">Seconds</span>
                </div>
            </div>
        </div>
        <img src="img/il_570xN.4253272448_3843-removebg-preview.png" class="spider" ;>
    </div>
    <script>
        var countDownDate = new Date("Oct 31, 2026 00:00:00").getTime();
        var x = setInterval(function () {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("days").innerHTML = "00";
                document.getElementById("hours").innerHTML = "00";
                document.getElementById("minutes").innerHTML = "00";
                document.getElementById("seconds").innerHTML = "00";
            }
        }, 1000); 
    </script>
</body>

</html>
